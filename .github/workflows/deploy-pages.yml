# 수동 실행 전용이다. 푸시 때마다 돌지 않는다.
#
# 왜 자동이 아닌가 — 정본 저장소(Connecting-app, D-2)에는 Pages를 켜지
# 않았고, 켜지 않은 저장소에서 이 워크플로가 돌면 Configure Pages에서
# 실패한다. 테스트는 통과했는데 커밋에 빨간 X가 붙으면 사람이 실패에
# 무뎌진다. 테스트 게이트는 ci.yml이 맡는다.
#
# 실행하기 전에 확인할 것 —
#   1. 그 저장소에 Pages가 켜져 있고 소스가 GitHub Actions인가
#   2. vite.config.ts의 base와 manifest id가 저장소 이름과 맞는가
#      지금은 '/medi-commu/'다. 다른 저장소에서 배포하면 경로가 어긋나 404가 난다
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
